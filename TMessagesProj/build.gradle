import org.gradle.internal.os.OperatingSystem

import java.nio.file.Paths

plugins {
    id 'com.android.library'
    id 'org.telegram.build-plugin'
    id 'idea'
}

idea {
    module {
        excludeDirs += [
            file('jni/td'),
            file('jni/third_party/absl'),
            file('jni/third_party/boringssl'),
            file('jni/third_party/dav1d'),
            file('jni/third_party/ffmpeg'),
            file('jni/third_party/libvpx'),
            file('jni/third_party/libyuv'),
            file('jni/third_party/openh264'),
            file('jni/third_party/xiph'),
            file('jni/third_party/wamr'),
            file('jni/third_party/libprisma'),
            file('jni/third_party/boost-regex'),
            file('jni/tgcalls'),
            file('jni/tlottie'),
            file('jni/voip/webrtc'),
            file('jni/sqlite')
        ]
    }
}

configurations.configureEach {
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.collection:collection:1.7.0'
    implementation 'androidx.fragment:fragment:1.9.1'
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.1.0'
    implementation "androidx.sharetarget:sharetarget:1.2.0"
    implementation 'androidx.interpolator:interpolator:1.0.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.webkit:webkit:1.14.0'

    implementation 'com.google.android.gms:play-services-cast-framework:22.3.1'
    implementation 'androidx.mediarouter:mediarouter:1.8.1'
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'com.neovisionaries:nv-websocket-client:2.14'

    implementation 'androidx.car.app:app:1.7.0'
    implementation 'androidx.car.app:app-projected:1.7.0'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    compileOnly 'org.checkerframework:checker-qual:2.5.2'
    compileOnly 'org.checkerframework:checker-compat-qual:2.5.0'
    implementation 'com.google.firebase:firebase-messaging:25.1.3'
    implementation 'com.google.firebase:firebase-appindexing:20.0.0'
    implementation 'com.google.android.gms:play-services-maps:20.0.0'
    implementation 'com.google.android.gms:play-services-auth:21.6.0'
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation 'com.google.android.gms:play-services-location:21.4.0'
    implementation 'com.googlecode.mp4parser:isoparser:1.0.6'
    implementation('com.stripe:stripe-android:2.0.2') {
        exclude group: 'com.android.support', module: 'support-annotations'
    }
    implementation 'com.google.mlkit:language-id:17.0.6'
    implementation 'com.android.billingclient:billing:9.1.0'
    implementation 'com.google.code.gson:gson:2.15.0'
    implementation ('com.google.guava:guava:33.7.2-android') {
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
        exclude group: 'org.checkerframework', module: 'checker-compat-qual'
        exclude group: 'org.checkerframework', module: 'checker-qual'
        exclude group: 'com.google.errorprone', module: 'error_prone_annotations'
        exclude group: 'com.google.j2objc', module: 'j2objc-annotations'
        exclude group: 'org.codehaus.mojo', module: 'animal-sniffer-annotations'
    }

    implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
    implementation 'com.google.android.gms:play-services-mlkit-image-labeling:16.0.8'


    implementation "io.noties.markwon:core:4.6.2"
    implementation "io.noties.markwon:ext-strikethrough:4.6.2"
    implementation "io.noties.markwon:ext-tables:4.6.2"
    implementation "io.noties.markwon:html:4.6.2"
    implementation "io.noties.markwon:inline-parser:4.6.2"
    implementation("io.noties.markwon:ext-latex:4.6.2") {
        exclude group: 'ru.noties', module: 'jlatexmath-android'
    }

    api project(":TMessagesProj_Modules:media3:media-lib-exoplayer")
    api project(":TMessagesProj_Modules:media3:media-lib-exoplayer-dash")
    api project(":TMessagesProj_Modules:media3:media-lib-exoplayer-hls")
    api project(":TMessagesProj_Modules:media3:media-lib-decoder-ffmpeg")
    api project(":TMessagesProj_Modules:media3:media-lib-session")
    api project(':jlatexmath')

    implementation 'androidx.browser:browser:1.10.0'
    implementation 'com.jaredrummler:truetypeparser-light:1.0.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.2'
    implementation 'org.apache.commons:commons-text:1.15.0'
    implementation 'org.chromium.net:cronet-api:143.7445.0'
    implementation 'com.google.net.cronet:cronet-okhttp:0.1.1'
    implementation 'com.google.android.gms:play-services-cronet:18.1.1'
    implementation 'co.nstant.in:cbor:0.9'

    implementation 'com.google.firebase:firebase-analytics:23.2.0'
    implementation 'com.google.android.play:integrity:1.3.0'
    implementation 'com.google.android.gms:play-services-safetynet:18.0.1'
    implementation 'com.google.android.gms:play-services-wallet:19.1.0'
    implementation "androidx.credentials:credentials:1.6.0-alpha04"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0-alpha04"
    implementation 'com.google.android.recaptcha:recaptcha:18.7.1'
    api platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-pnv'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    // Offline Voice-to-Text (compatible with all Android versions, no API key required)
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    implementation('com.alphacephei:vosk-android:0.3.75') {
        exclude group: 'net.java.dev.jna', module: 'jna'
    }
}

android {
    sourceSets.main.jniLibs.srcDirs = ['src/main/jniLibs']

    buildFeatures {
        aidl = true
    }

    defaultConfig {
        vectorDrawables.generatedDensities = []
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        debug {
            buildConfigField("long", "VERSION_CODE", "${APP_VERSION_CODE}")
            buildConfigField("String","VERSION_NAME","\"${APP_VERSION_NAME}\"")
            buildConfigField("long", "BUILD_VERSION", "${TG_APP_VERSION_CODE}")
            buildConfigField("String","BUILD_VERSION_STRING","\"${TG_APP_VERSION_NAME}\"")
            buildConfigField("boolean", "DEBUG_VERSION", "false")
            buildConfigField("boolean", "DEBUG_PRIVATE_VERSION", "false")
            buildConfigField("boolean", "BUNDLE", "false")

            buildConfigField("int", "API_ID", "37574376")
            buildConfigField("String", "API_HASH", "\"51b61cb9574c106fd63b3f3c0f1e74fd\"")
            buildConfigField("String","SENTRY_DSN", "\"\"")
            buildConfigField("long","HELPER_BOT_ID", "0")
            buildConfigField("String","HELPER_BOT_USERNAME", "\"\"")
        }

        release {
            buildConfigField("long", "VERSION_CODE", "${APP_VERSION_CODE}")
            buildConfigField("String","VERSION_NAME","\"${APP_VERSION_NAME}\"")
            buildConfigField("long", "BUILD_VERSION", "${TG_APP_VERSION_CODE}")
            buildConfigField("String","BUILD_VERSION_STRING","\"${TG_APP_VERSION_NAME}\"")
            buildConfigField("boolean", "DEBUG_VERSION", "false")
            buildConfigField("boolean", "DEBUG_PRIVATE_VERSION", "false")
            buildConfigField("boolean", "BUNDLE", "false")

            buildConfigField("int", "API_ID", "37574376")
            buildConfigField("String", "API_HASH", "\"51b61cb9574c106fd63b3f3c0f1e74fd\"")
            buildConfigField("String","SENTRY_DSN", "\"\"")
            buildConfigField("long","HELPER_BOT_ID", "0")
            buildConfigField("String","HELPER_BOT_USERNAME", "\"\"")
        }
    }

    namespace = 'org.telegram.messenger'
}
