import com.android.build.api.variant.FilterConfiguration

plugins {
    id 'com.android.application'
    id 'org.telegram.build-app-plugin'
    id 'com.google.gms.google-services'
}

dependencies {
    implementation project(':TMessagesProj')
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'
}

android {
    defaultConfig.applicationId = "com.rcuenca.kronogram"

    packagingOptions {
        resources {
            excludes += [
                'META-INF/**',
                '**.kotlin_module',
                '**.version',
                '**.proto',
                'google/protobuf/**',
                'kotlin/**',
                'DebugProbesKt.bin',
                'build-data.properties'
            ]
        }
        jniLibs {
            useLegacyPackaging = true
            pickFirsts += ['**/*.so']
        }
    }

    androidResources {
        noCompress += "pack"
    }

    signingConfigs {
        debug {
            storeFile file("${rootDir}/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            def ksPath = System.getenv("KEYSTORE_PATH")
            if (ksPath != null && !ksPath.isEmpty() && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("STORE_PASSWORD")
                keyAlias(System.getenv("KEY_ALIAS") ?: "upload")
                keyPassword System.getenv("KEY_PASSWORD")
            } else {
                storeFile file("${rootDir}/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', '../TMessagesProj/proguard-rules.pro'
        }
    }

    defaultConfig.versionCode = Integer.parseInt(APP_VERSION_CODE)

    defaultConfig {
        versionName APP_VERSION_NAME
        multiDexEnabled true

        manifestPlaceholders = [MAPS_API_KEY: ""]
    }

    splits.abi {
        def buildingBundle = gradle.startParameter.taskNames.any { it.startsWith("bundle") }
        enable = !buildingBundle
        universalApk = false
        reset()
        include "arm64-v8a"
    }

    namespace = 'org.telegram.messenger.regular'

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def abi = output.filters.find { it.filterType == FilterConfiguration.FilterType.ABI }?.identifier
            def abiName = abi ?: "universal"
            def baseVersionCode = output.versionCode.get()
            def kronoVersion = project.property("APP_VERSION_NAME_KRONO")
            output.outputFileName.set("KronoGram-${kronoVersion}-TG-${output.versionName.get()}-${abiName}.apk")
            output.versionCode.set(baseVersionCode * 10)
        }
    }
}
